[package]
name = "datara-data-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
datara-domain.workspace = true
# ponytail: default-features off — only Model/ModelRc/SharedString are needed;
# the app crate's workspace slint dep supplies backend features when they unify.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "cache"
harness = false
