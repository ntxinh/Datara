[workspace]
resolver = "2"
members = [
    "crates/app", "crates/domain", "crates/database", "crates/driver-mssql",
    "crates/sql-editor", "crates/data-grid", "crates/secrets",
    "crates/mcp-server", "crates/storage", "crates/config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ntxinh/Datara"
rust-version = "1.98"

[workspace.dependencies]
datara-domain = { path = "crates/domain" }
datara-database = { path = "crates/database" }
datara-driver-mssql = { path = "crates/driver-mssql" }
datara-sql-editor = { path = "crates/sql-editor" }
datara-data-grid = { path = "crates/data-grid" }
datara-secrets = { path = "crates/secrets" }
datara-mcp-server = { path = "crates/mcp-server" }
datara-storage = { path = "crates/storage" }
datara-config = { path = "crates/config" }
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg", "std", "compat-1-18"] }
slint-build = "1.18"
i-slint-backend-testing = { version = "1.18", features = ["renderer-software"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "time"] }
async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
secrecy = { version = "0.10", features = ["serde"] }
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
schemars = "1"
sqlparser = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = "0.3"
thiserror = "2"
anyhow = "1"
jiff = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
rstest = "0.27"
testcontainers = "0.28"
criterion = "0.8"
dirs = "7"
parking_lot = "0.12"
tempfile = "3"
