[licenses]
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
]

[advisories]
yanked = "warn"
ignore = [
    # ttf-parser is unmaintained, but only reached through
    # winit→sctk-adwaita (window-titlebar font parsing) via Slint's winit
    # backend — no direct API use, no fix available, remove when winit or
    # Slint migrates to skrifa.
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
